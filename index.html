<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sential AI — Autonomous Web Application Security</title>
    <meta name="description" content="Autonomous web security scanner with AI-driven root cause analysis, automated remediation code, and verified retesting.">
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <!-- Google Fonts: Manrope & Cairo (Exact Figma Prototype + Arabic Typography) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Prevent theme and language flash -->
    <script>
        (function() {
            try {
                var theme = localStorage.getItem('sential_theme');
                if (theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                } else {
                    document.documentElement.setAttribute('data-theme', 'light');
                }

                var lang = localStorage.getItem('sential_lang') || 'en';
                document.documentElement.setAttribute('lang', lang);
                document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            } catch (e) {}
        })();
    </script>

    <!-- Application Stylesheets -->
    <link rel="stylesheet" href="assets/css/style.css?v=5.9">
    <link rel="stylesheet" href="assets/css/sheet.css?v=4.8">
    
    <style>
        body {
            font-family: 'Manrope', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f9fc;
            color: #0f172a;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.25s ease, color 0.25s ease;
        }
        [data-theme="dark"] body, body.dark-theme {
            background-color: #060a14 !important;
            color: #e2e8f0 !important;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Root Container for Dynamic SPA Views -->
    <div id="root"></div>

    <!-- Application JavaScript Modules with Cache Busting -->
    <script src="assets/js/i18n.js?v=1.0"></script>
    <script src="assets/js/icons.js?v=4.4"></script>
    <script src="assets/js/api.js?v=4.4"></script>
    <script src="assets/js/cyber-matrix.js?v=4.7"></script>
    <script src="assets/js/sheet.js?v=4.7"></script>
    <script src="assets/js/app.js?v=5.9"></script>
</body>
</html>
